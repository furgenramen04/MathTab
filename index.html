<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathTab</title>
  </head>
  <body>

    <div id="dualtimeclock" class="glass">
      <div class="clock" id="clock1">
        <h3 class="city">Sydney</h3>
        <div class="clockbodytext">
          <p id="sydneytime" class="time">0400</p>
          <p id="sydneydst" class="dst">On</p>
        </div>
      </div>

      <div class="clockdiff" id="clockdiff"></div>

      <div class="clock" id="clock2">
        <h3 class="city">Dhaka</h3>
        <div class="clockbodytext">
          <p id="dhakatime" class="time">2300</p>
          <p id="dhakadst" class="dst">Off</p>
        </div>
      </div>
    </div>

    <div class="searchbar">
      <h1>MathTab</h1>
      <form class="search glass" action="https://www.google.com/search" method="get">
        <input type="text" placeholder="Search Google.com" name="q" aria-label="Search Google">
        <button type="submit">Discover</button>
      </form>

      <figure id="dailyquote">
        <blockquote>
          <svg viewBox="0 0 600 100" width="600">
            <path id="quotecurve" d="M 20 10 Q 300 90 580 10" fill="none" />
            <path id="authorcurve" d="M 150 40 Q 300 120 450 40" fill="none" />
            <text font-size="18">
              <textPath id="quote" href="#quotecurve" startOffset="50%" text-anchor="middle">
                The only way to learn mathematics is to do mathematics.
              </textPath>
            </text>
            <text font-size="14">
              <textPath id="author" href="#authorcurve" startOffset="50%" text-anchor="middle">-Paul Halmos</textPath>
            </text>
          </svg>
        </blockquote>
      </figure>
    </div>

    <nav id="shortcuts">
      <form id="addform" class="glass" hidden>
        <input id="newname" placeholder="Name">
        <input id="newurl" placeholder="example.com">
        <button type="submit">Add</button>
      </form>
      <div class="links glass" id="links"></div>
    </nav>

    <aside class="column" id="leftcol">
      <div class="calculator glass">
        <input type="text" readonly id="display">
        <div class="buttons">
          <button>2nd</button>
          <button>&lt;</button>
          <button>&gt;</button>
          <button>AC</button>
          <button>SIN</button>
          <button>COS</button>
          <button>TAN</button>
          <button>x^y</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>÷</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>×</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>−</button>
          <button>0</button>
          <button>.</button>
          <button>=</button>
          <button>+</button>
        </div>
      </div>

      <div class="grapher glass">
        <input type="text" id="equation" placeholder="y=">
        <canvas id="graph" width="300" height="300"></canvas>
      </div>
    </aside>

    <aside class="column" id="rightcol">
      <div class="calendar glass">
        <div class="cal-header">
          <button id="calprev" aria-label="Previous month">&lt;</button>
          <span id="calmonth"></span>
          <button id="calnext" aria-label="Next month">&gt;</button>
        </div>
        <table>
          <thead>
            <tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>
          </thead>
          <tbody id="calbody"></tbody>
        </table>
      </div>

      <section id="moon" class="glass">
        <h3>Moon Phase</h3>
        <svg id="moonsvisual" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Current Moon Phase">
          <circle cx="50" cy="50" r="45" fill="#1c1c28"/>
          <path id="moonlit" fill="#f2efe4"></path>
        </svg>
        <p id="moonphase">Waxing Gibbous</p>
        <p id="moonage">Age: 10 days</p>
      </section>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
